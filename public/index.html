<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rendimiento de Buses</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" />
<style>
  :root {
    --navy: #10151c;
    --navy-2: #1a2129;
    --verde: #1d9e75;
    --verde-claro: #e1f5ee;
    --verde-texto: #085041;
    --ambar-claro: #faeeda;
    --ambar-texto: #633806;
    --azul-claro: #e6f1fb;
    --azul-texto: #0c447c;
    --rojo-claro: #fcebeb;
    --rojo-texto: #791f1f;
    --gris: #6b7280;
    --gris-claro: #f3f4f6;
    --borde: #e5e7eb;
    --fondo: #f7f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fondo);
    color: #111827;
  }
  #root { display: flex; min-height: 100vh; }

  /* --- sidebar --- */
  aside {
    width: 320px;
    flex-shrink: 0;
    background: var(--navy);
    color: #a8b0bb;
    padding: 0;
  }
  .sidebar-sticky {
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
    padding: 20px 14px 24px;
  }
  .marca {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    padding: 0 4px;
  }
  .marca-icono {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    background: var(--verde);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 17px;
    flex-shrink: 0;
  }
  .marca-texto {
    color: white;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.25;
  }
  .marca-texto span { color: var(--verde); }
  .nav-seccion {
    font-size: 10px;
    letter-spacing: 0.06em;
    color: #5b6472;
    margin: 0 8px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 7px;
    font-size: 13px;
    background: var(--navy-2);
    color: var(--verde);
    margin-bottom: 20px;
  }
  .nav-item i { font-size: 16px; }
  .card-sidebar {
    margin-bottom: 0;
    padding: 20px 18px;
  }

  /* --- main --- */
  main { flex: 1; padding: 32px 40px 60px; max-width: 1080px; }
  .encabezado {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .encabezado h1 { margin: 0; font-size: 19px; font-weight: 600; }
  .encabezado p { margin: 3px 0 0; font-size: 13px; color: var(--gris); }
  .fecha-hoy { font-size: 13px; color: var(--gris); padding-top: 3px; }

  .card {
    background: white;
    border: 0.5px solid var(--borde);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
  h3 { font-size: 13px; font-weight: 600; margin: 20px 0 10px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  select, input[type="date"], input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--borde);
    border-radius: 7px;
    font-size: 14px;
    background: white;
    font-family: inherit;
  }
  .bloque { margin-bottom: 18px; }
  .fila-hora {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .campo-hora {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .campo-hora select { width: 72px; flex: 0 0 72px; }
  .campo-hora .sep { color: var(--gris); font-weight: 600; }
  .fila-fechas {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .vehiculos-box {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--borde);
    border-radius: 7px;
    padding: 10px 12px;
  }
  .vehiculo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 14px;
  }
  .vehiculo-item input { margin: 0; }
  .top-vehiculos {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--verde-texto);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }
  button.primario {
    background: var(--navy);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primario:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  .error-msg {
    background: var(--rojo-claro);
    color: var(--rojo-texto);
    border: 1px solid #f0999966;
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .aviso-msg {
    background: var(--ambar-claro);
    color: var(--ambar-texto);
    border: 1px solid #ef9f2766;
    padding: 10px 14px;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .cargando { color: var(--gris); font-size: 14px; }

  .estado-vacio {
    text-align: center;
    padding: 60px 24px;
    color: var(--gris);
  }
  .estado-vacio i { font-size: 32px; color: #d1d5db; margin-bottom: 12px; display: block; }
  .estado-vacio p { margin: 0; font-size: 14px; max-width: 320px; margin: 0 auto; }

  .resumen-flota {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 8px;
    align-items: center;
  }
  @media (max-width: 720px) {
    .resumen-flota { grid-template-columns: 1fr; }
  }
  .resumen-calugas {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .caluga {
    border-radius: 999px;
    padding: 14px 22px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .caluga-valor { font-size: 20px; font-weight: 600; color: #10151C; }
  .caluga-etiqueta { font-size: 12px; color: var(--gris); }
  .resumen-dona {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .dona-svg { width: 200px; height: 200px; flex-shrink: 0; }
  .dona-leyenda {
    display: grid;
    grid-template-columns: auto 1fr auto;
    row-gap: 10px;
    column-gap: 10px;
    align-items: center;
  }
  .dona-leyenda-item { display: contents; }
  .dona-leyenda-item span:not(.dona-punto) { font-size: 12px; color: var(--gris); }
  .dona-leyenda-item strong { text-align: right; color: #10151C; font-size: 13px; white-space: nowrap; }
  .dona-punto { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .comparativo {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 8px;
  }
  @media (max-width: 900px) {
    .comparativo { grid-template-columns: 1fr; }
  }
  .comparativo-card {
    border: none;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }
  .comparativo-emoji { font-size: 26px; margin-bottom: 6px; }
  .comparativo-etiqueta { font-size: 12px; color: var(--gris); margin-bottom: 2px; }
  .comparativo-valor { font-size: 15px; font-weight: 600; }
  .comparativo-detalle { font-size: 12px; color: var(--gris); margin-top: 4px; }
  .metrica {
    border-left: 3px solid var(--acento, var(--verde));
    padding-left: 14px;
  }
  .metrica-etiqueta { font-size: 12px; color: var(--gris); margin-top: 4px; }
  .metrica .valor { font-size: 22px; font-weight: 500; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 10px 14px;
    background: white;
    color: var(--gris);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--borde);
  }
  td { padding: 12px 14px; border-bottom: 0.5px solid var(--borde); }
  .tabla-wrap { border: 0.5px solid var(--borde); border-radius: 16px; overflow: hidden; }
  .placa-row { cursor: pointer; }
  .placa-row:hover { background: var(--gris-claro); }
  .placa-celda { font-weight: 600; }
  .pill {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 5px;
    font-weight: 500;
  }
  .pill-ok { background: #eaf3de; color: #173404; }
  .pill-warn { background: var(--ambar-claro); color: var(--ambar-texto); }
  .pill-muted { background: var(--gris-claro); color: var(--gris); }

  .ranking-wrap {
    background: white;
    border: 0.5px solid var(--borde);
    border-radius: 16px;
    overflow: hidden;
  }
  .ranking-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    cursor: pointer;
    border-bottom: 1px solid #f1f1ef;
  }
  .ranking-row:hover { background: var(--gris-claro); }
  .ranking-pos {
    width: 20px;
    font-size: 12px;
    color: #9ca3af;
    flex-shrink: 0;
    text-align: center;
  }
  .ranking-medalla { font-size: 16px; }
  .ranking-placa { font-size: 13px; font-weight: 600; width: 72px; flex-shrink: 0; }
  .ranking-barra {
    flex: 1;
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--gris-claro);
  }
  .ranking-barra-vacia { background: var(--gris-claro); }
  .ranking-valor { font-size: 13px; font-weight: 600; width: 90px; text-align: right; flex-shrink: 0; }
  .ranking-aviso-slot { width: 16px; flex-shrink: 0; display: flex; justify-content: center; }
  .ranking-detalle {
    padding: 16px 18px 20px;
    background: var(--fondo);
    border-bottom: 1px solid #f1f1ef;
  }
  .ranking-metricas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px 20px;
  }

  .viajes-detalle { background: var(--gris-claro); }
  .viajes-detalle td { padding: 4px 14px 4px 34px; font-size: 12px; }
  .tabla-viajes {
    width: 100%;
    margin-top: 6px;
    border-collapse: collapse;
    font-size: 12px;
    background: white;
    border: 1px solid var(--borde);
    border-radius: 6px;
    overflow: hidden;
  }
  .tabla-viajes th {
    text-align: left;
    padding: 6px 10px;
    background: var(--fondo);
    color: var(--gris);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--borde);
  }
  .tabla-viajes td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--borde);
    color: #111827;
  }
  .tabla-viajes tr:last-child td { border-bottom: none; }
  .coord-link { color: #378ADD; text-decoration: none; font-size: 11px; white-space: nowrap; }
  .coord-link:hover { text-decoration: underline; }
  .coord-localidad { font-size: 12px; font-weight: 600; color: #10151C; white-space: nowrap; }
  .nota { font-size: 12px; color: var(--gris); margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;
  var useMemo = React.useMemo;

  // --- utilidades ---

  function formatearFecha(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString('es-CL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  }

  function formatearSoloFecha(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function formatearSoloHora(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false });
  }

  // formatea una clave de día 'YYYY-MM-DD' (sin componente de hora) a una
  // fecha legible, sin desfases de zona horaria por interpretarla como UTC.
  function formatearDiaYMD(fechaYMD) {
    if (!fechaYMD) return '';
    var partes = fechaYMD.split('-');
    var d = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
    return d.toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // Renderiza una coordenada {lat, lon, localidad?} como enlace a Google
  // Maps; si se resolvió la localidad (comuna/ciudad), se muestra arriba del
  // link. Si no hay coordenada válida (GPS perdido en ese punto), un guión.
  function enlaceCoordenada(coord) {
    if (!coord) return '—';
    var texto = coord.lat.toFixed(5) + ', ' + coord.lon.toFixed(5);
    var url = 'https://www.google.com/maps?q=' + coord.lat + ',' + coord.lon;
    return h('div', null,
      coord.localidad && h('div', { className: 'coord-localidad' }, coord.localidad),
      h('a', { href: url, target: '_blank', rel: 'noopener noreferrer', className: 'coord-link' }, texto)
    );
  }

  function formatearFechaHoy() {
    var d = new Date();
    var texto = d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function numero(n, decimales) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    return Number(n).toLocaleString('es-CL', { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
  }

  // convierte minutos a un formato legible: "45 min" o "2h 15min"
  function formatearDuracion(minutos) {
    if (minutos === null || minutos === undefined || Number.isNaN(minutos)) return '—';
    if (minutos < 60) return numero(minutos, 1) + ' min';
    var horas = Math.floor(minutos / 60);
    var mins = Math.round(minutos % 60);
    return horas + 'h ' + mins + 'min';
  }

  // combina un input date (YYYY-MM-DD) + hora (00-23) + minuto (00-59), en
  // hora LOCAL del navegador, y devuelve el ISO string correspondiente (UTC).
  function combinarFechaHora(fecha, hora, minuto) {
    if (!fecha) return null;
    var partes = fecha.split('-');
    var d = new Date(
      Number(partes[0]),
      Number(partes[1]) - 1,
      Number(partes[2]),
      Number(hora),
      Number(minuto),
      0
    );
    if (Number.isNaN(d.getTime())) return null;
    return d.toISOString();
  }

  var HORAS = [];
  for (var hh = 0; hh < 24; hh++) HORAS.push(hh < 10 ? '0' + hh : '' + hh);
  var MINUTOS = ['00', '15', '30', '45'];

  // --- componente: selector de hora en formato 24hrs ---

  function SelectorHora(props) {
    return h('div', { className: 'fila-hora' },
      h('div', null,
        h('label', null, props.etiqueta),
        h('input', {
          type: 'date',
          value: props.fecha,
          onChange: function (e) { props.onFecha(e.target.value); },
        })
      ),
      h('div', { className: 'campo-hora' },
        h('select', {
          value: props.hora,
          onChange: function (e) { props.onHora(e.target.value); },
          'aria-label': 'Hora (' + props.etiqueta + ')',
        }, HORAS.map(function (v) { return h('option', { key: v, value: v }, v); })),
        h('span', { className: 'sep' }, ':'),
        h('select', {
          value: props.minuto,
          onChange: function (e) { props.onMinuto(e.target.value); },
          'aria-label': 'Minutos (' + props.etiqueta + ')',
        }, MINUTOS.map(function (v) { return h('option', { key: v, value: v }, v); }))
      )
    );
  }

  // --- componente: tarjeta de métrica ---

  function Metrica(props) {
    return h('div', { className: 'metrica', style: { borderLeftColor: props.color } },
      h('div', { className: 'valor' }, props.valor),
      h('div', { className: 'metrica-etiqueta' }, props.etiqueta)
    );
  }

  // --- componente: tarjeta del cuadro comparativo (mejor día / mejor
  // vehículo / mejor viaje) ---

  function TarjetaComparativa(props) {
    return h('div', { className: 'comparativo-card', style: { background: props.fondo } },
      h('div', { className: 'comparativo-emoji' }, props.emoji),
      h('div', { className: 'comparativo-etiqueta' }, props.etiqueta),
      h('div', { className: 'comparativo-valor' }, props.valor),
      props.detalle && h('div', { className: 'comparativo-detalle' }, props.detalle)
    );
  }

  // --- componente: fila de vehículo con detalle de viajes expandible ---

  var MEDALLAS = ['🥇', '🥈', '🥉'];

  function FilaRanking(props) {
    var v = props.vehiculo;
    var posicion = props.posicion;
    var expandido = props.expandido;
    var tieneAvisos = v.advertencias && v.advertencias.length > 0;
    var sinDatos = v.rendimientoKmPorLitro === null && v.kmRecorridos === 0;

    // proporciones de la mini-barra, sobre horasMotorMinutos (puede quedar
    // un remanente sin categorizar: tramos de transición entre categorías)
    var horas = v.horasMotorMinutos || 0;
    var pctRentable = horas > 0 ? Math.min(100, (v.conduccionRentableMinutos / horas) * 100) : 0;
    var pctRalenti = horas > 0 ? Math.min(100, (v.ralentiMinutos / horas) * 100) : 0;
    var pctAccelVacio = horas > 0 ? Math.min(100, (v.aceleracionVacioMinutos / horas) * 100) : 0;
    var pctNoRentable = horas > 0 ? Math.min(100, (v.conduccionNoRentableMinutos / horas) * 100) : 0;

    return h('div', { key: v.placa },
      h('div', { className: 'ranking-row', onClick: props.onToggle },
        posicion <= 3 && !sinDatos
          ? h('span', { className: 'ranking-pos ranking-medalla' }, MEDALLAS[posicion - 1])
          : h('span', { className: 'ranking-pos' }, sinDatos ? '—' : posicion),
        h('span', { className: 'ranking-placa' }, v.placa),
        sinDatos
          ? h('div', { className: 'ranking-barra ranking-barra-vacia' })
          : h('div', { className: 'ranking-barra' },
              h('div', { style: { width: pctRentable + '%', background: '#1D9E75' } }),
              h('div', { style: { width: pctRalenti + '%', background: '#EF9F27' } }),
              h('div', { style: { width: pctNoRentable + '%', background: '#E24B4A' } }),
              h('div', { style: { width: pctAccelVacio + '%', background: '#378ADD' } })
            ),
        h('span', { className: 'ranking-aviso-slot' },
          tieneAvisos && h('i', { className: 'ti ti-alert-triangle', style: { color: '#EF9F27', fontSize: '14px' }, title: v.advertencias.length + ' aviso(s)', 'aria-hidden': 'true' })
        ),
        h('span', { className: 'ranking-valor', style: { color: sinDatos ? '#9ca3af' : '#085041' } },
          sinDatos ? 'Sin datos' : numero(v.rendimientoKmPorLitro, 2) + ' km/L'
        ),
        h('i', { className: 'ti ti-chevron-' + (expandido ? 'up' : 'down'), style: { color: '#9ca3af', fontSize: '14px' }, 'aria-hidden': 'true' })
      ),
      expandido && h('div', { className: 'ranking-detalle' },
        h('div', { className: 'ranking-metricas' },
          h(Metrica, { etiqueta: 'km recorridos', valor: numero(v.kmRecorridos, 1), color: '#1D9E75' }),
          h(Metrica, { etiqueta: 'litros consumidos', valor: numero(v.litrosConsumidos, 1), color: '#EF9F27' }),
          h(Metrica, { etiqueta: 'km/L', valor: v.rendimientoKmPorLitro === null ? '—' : numero(v.rendimientoKmPorLitro, 2), color: '#378ADD' }),
          h(Metrica, { etiqueta: 'vel. máxima', valor: v.velocidadMaxima === null ? '—' : numero(v.velocidadMaxima, 1), color: '#378ADD' }),
          h(Metrica, { etiqueta: 'horas de motor', valor: formatearDuracion(v.horasMotorMinutos), color: '#378ADD' }),
          h(Metrica, { etiqueta: 'ralentí', valor: formatearDuracion(v.ralentiMinutos), color: '#E24B4A' }),
          h(Metrica, { etiqueta: 'aceleración en vacío', valor: formatearDuracion(v.aceleracionVacioMinutos), color: '#EF9F27' }),
          h(Metrica, { etiqueta: 'conducción rentable', valor: formatearDuracion(v.conduccionRentableMinutos), color: '#1D9E75' }),
          h(Metrica, { etiqueta: 'conducción no rentable', valor: formatearDuracion(v.conduccionNoRentableMinutos), color: '#E24B4A' })
        ),

        h('div', { style: { marginTop: '16px' } },
          h('strong', { style: { fontSize: '13px' } }, (v.viajes || []).length + ' viaje(s) detectado(s) en el rango'),
          (v.viajes || []).length > 0 && h('table', { className: 'tabla-viajes' },
            h('thead', null,
              h('tr', null,
                h('th', null, 'Fecha'),
                h('th', null, 'Inicio'),
                h('th', null, 'Término'),
                h('th', null, 'km recorridos'),
                h('th', null, 'Litros consumidos'),
                h('th', null, 'Rendimiento'),
                h('th', null, 'Origen'),
                h('th', null, 'Destino')
              )
            ),
            h('tbody', null,
              (v.viajes || []).map(function (viaje, i) {
                return h('tr', { key: 'viaje-' + i },
                  h('td', null, formatearSoloFecha(viaje.inicio)),
                  h('td', null, formatearSoloHora(viaje.inicio)),
                  h('td', null, formatearSoloHora(viaje.fin)),
                  h('td', null, numero(viaje.kmRecorridos, 1)),
                  h('td', null, numero(viaje.litrosSegunOdolitro, 1)),
                  h('td', null, viaje.rendimientoKmPorLitro !== null ? numero(viaje.rendimientoKmPorLitro, 2) + ' km/L' : '—'),
                  h('td', null, enlaceCoordenada(viaje.coordenadaInicio)),
                  h('td', null, enlaceCoordenada(viaje.coordenadaFin))
                );
              })
            )
          )
        )
      )
    );
  }

  // --- componente: resumen de flota (3 calugas + dona de reparto de tiempo) ---

  function ResumenFlota(props) {
    var f = props.flota;
    var horas = f.horasMotorMinutos || 0;
    var pctRentable = horas > 0 ? (f.conduccionRentableMinutos / horas) * 100 : 0;
    var pctRalenti = horas > 0 ? (f.ralentiMinutos / horas) * 100 : 0;
    var pctNoRentable = horas > 0 ? (f.conduccionNoRentableMinutos / horas) * 100 : 0;
    var pctAccelVacio = horas > 0 ? (f.aceleracionVacioMinutos / horas) * 100 : 0;

    // circunferencia de un círculo r=70 ≈ 439.8, usada para los stroke-dasharray
    var CIRC = 439.8;
    var R = 70;
    var GROSOR = 26;
    var C = 100; // centro del viewBox (0 0 200 200)

    var segRentableCrudo = (pctRentable / 100) * CIRC;
    var segRalentiCrudo = (pctRalenti / 100) * CIRC;
    var segNoRentableCrudo = (pctNoRentable / 100) * CIRC;
    var segAccelVacioCrudo = (pctAccelVacio / 100) * CIRC;

    // Ancho mínimo VISIBLE para cualquier segmento con valor > 0: sin esto,
    // categorías reales pero muy chicas (ej. "no rentable" de solo minutos
    // en un total de decenas de horas) quedan con un arco de menos de un
    // píxel y se ven como si no existieran. El valor exacto se sigue
    // mostrando en la leyenda; esto solo asegura que el color se note.
    var MIN_VISIBLE = CIRC * 0.012;
    function anchoVisible(seg) {
      return seg > 0 && seg < MIN_VISIBLE ? MIN_VISIBLE : seg;
    }

    // los offsets (dónde empieza cada arco) se calculan con los anchos
    // reales (no con el mínimo visible), para no desalinear el orden de la
    // dona por el ajuste de segmentos pequeños.
    var segmentos = [
      { color: '#1D9E75', crudo: segRentableCrudo, offset: 0 },
      { color: '#EF9F27', crudo: segRalentiCrudo, offset: -segRentableCrudo },
      { color: '#E24B4A', crudo: segNoRentableCrudo, offset: -(segRentableCrudo + segRalentiCrudo) },
      { color: '#378ADD', crudo: segAccelVacioCrudo, offset: -(segRentableCrudo + segRalentiCrudo + segNoRentableCrudo) },
    ];

    // se pintan del más GRANDE al más CHICO: en SVG, lo que se dibuja al
    // final queda arriba. Así el segmento más chico (el que se agranda
    // artificialmente para ser visible) siempre termina encima de sus
    // vecinos, en vez de que un vecino más grande lo tape.
    var segmentosOrdenados = segmentos.slice().sort(function (a, b) { return b.crudo - a.crudo; });

    return h('div', { className: 'resumen-flota' },
      h('div', { className: 'resumen-calugas' },
        h('div', { className: 'caluga', style: { background: '#E6F1FB' } },
          h('div', { className: 'caluga-valor' }, formatearDuracion(f.horasMotorMinutos)),
          h('div', { className: 'caluga-etiqueta' }, 'horas de motor')
        ),
        h('div', { className: 'caluga', style: { background: '#EAF3DE' } },
          h('div', { className: 'caluga-valor' }, numero(f.kmRecorridos, 1)),
          h('div', { className: 'caluga-etiqueta' }, 'km recorridos')
        ),
        h('div', { className: 'caluga', style: { background: '#FFF9EC' } },
          h('div', { className: 'caluga-valor' }, f.rendimientoKmPorLitro === null ? '—' : numero(f.rendimientoKmPorLitro, 2)),
          h('div', { className: 'caluga-etiqueta' }, 'km/L')
        )
      ),
      h('div', { className: 'resumen-dona' },
        h('svg', { viewBox: '0 0 200 200', className: 'dona-svg' },
          h('circle', { cx: C, cy: C, r: R, fill: 'none', stroke: '#eee', strokeWidth: GROSOR }),
          horas > 0 && segmentosOrdenados.map(function (seg, i) {
            return h('circle', {
              key: i,
              cx: C, cy: C, r: R, fill: 'none', stroke: seg.color, strokeWidth: GROSOR,
              strokeDasharray: anchoVisible(seg.crudo) + ' ' + CIRC, strokeDashoffset: seg.offset,
              transform: 'rotate(-90 ' + C + ' ' + C + ')',
            });
          }),
          h('text', { x: C, y: C - 5, textAnchor: 'middle', fontSize: 22, fontWeight: 600, fill: '#10151C' }, formatearDuracion(f.horasMotorMinutos)),
          h('text', { x: C, y: C + 17, textAnchor: 'middle', fontSize: 12, fill: '#9ca3af' }, 'motor')
        ),
        h('div', { className: 'dona-leyenda' },
          h('div', { className: 'dona-leyenda-item' },
            h('span', { className: 'dona-punto', style: { background: '#1D9E75' } }),
            h('span', null, 'Conducción rentable'),
            h('strong', null, formatearDuracion(f.conduccionRentableMinutos))
          ),
          h('div', { className: 'dona-leyenda-item' },
            h('span', { className: 'dona-punto', style: { background: '#EF9F27' } }),
            h('span', null, 'Ralentí'),
            h('strong', null, formatearDuracion(f.ralentiMinutos))
          ),
          h('div', { className: 'dona-leyenda-item' },
            h('span', { className: 'dona-punto', style: { background: '#378ADD' } }),
            h('span', null, 'Aceleración en vacío'),
            h('strong', null, formatearDuracion(f.aceleracionVacioMinutos))
          ),
          h('div', { className: 'dona-leyenda-item' },
            h('span', { className: 'dona-punto', style: { background: '#E24B4A' } }),
            h('span', null, 'Conducción no rentable'),
            h('strong', null, formatearDuracion(f.conduccionNoRentableMinutos))
          )
        )
      )
    );
  }

  // --- componente principal ---

  function App() {
    var empresasState = useState([]);
    var empresas = empresasState[0], setEmpresas = empresasState[1];

    var cargandoEmpresasState = useState(true);
    var cargandoEmpresas = cargandoEmpresasState[0], setCargandoEmpresas = cargandoEmpresasState[1];

    var errorEmpresasState = useState(null);
    var errorEmpresas = errorEmpresasState[0], setErrorEmpresas = errorEmpresasState[1];

    var empresaIdState = useState('');
    var empresaId = empresaIdState[0], setEmpresaId = empresaIdState[1];

    var placasSelState = useState({});
    var placasSel = placasSelState[0], setPlacasSel = placasSelState[1];

    // fecha/hora "desde", en formato 24hrs (hora y minuto van por separado)
    var desdeFechaState = useState('');
    var desdeFecha = desdeFechaState[0], setDesdeFecha = desdeFechaState[1];
    var desdeHoraState = useState('00');
    var desdeHora = desdeHoraState[0], setDesdeHora = desdeHoraState[1];
    var desdeMinState = useState('00');
    var desdeMin = desdeMinState[0], setDesdeMin = desdeMinState[1];

    // fecha/hora "hasta"
    var hastaFechaState = useState('');
    var hastaFecha = hastaFechaState[0], setHastaFecha = hastaFechaState[1];
    var hastaHoraState = useState('23');
    var hastaHora = hastaHoraState[0], setHastaHora = hastaHoraState[1];
    var hastaMinState = useState('45');
    var hastaMin = hastaMinState[0], setHastaMin = hastaMinState[1];

    var cargandoResState = useState(false);
    var cargandoRes = cargandoResState[0], setCargandoRes = cargandoResState[1];

    var errorResState = useState(null);
    var errorRes = errorResState[0], setErrorRes = errorResState[1];

    var resultadoState = useState(null);
    var resultado = resultadoState[0], setResultado = resultadoState[1];

    var expandidoState = useState(null);
    var expandidoPlaca = expandidoState[0], setExpandidoPlaca = expandidoState[1];

    useEffect(function () {
      setCargandoEmpresas(true);
      fetch('/api/empresas')
        .then(function (res) {
          if (!res.ok) throw new Error('El servidor respondió ' + res.status);
          return res.json();
        })
        .then(function (data) {
          setEmpresas(data);
          setCargandoEmpresas(false);
        })
        .catch(function (err) {
          setErrorEmpresas('No se pudo cargar la lista de empresas: ' + err.message + '. Si el servidor estaba dormido, recarga la página en unos segundos.');
          setCargandoEmpresas(false);
        });
    }, []);

    var empresaActual = useMemo(function () {
      return empresas.find(function (e) { return e.empresaId === empresaId; }) || null;
    }, [empresas, empresaId]);

    function handleEmpresaChange(e) {
      setEmpresaId(e.target.value);
      setPlacasSel({});
      setResultado(null);
      setErrorRes(null);
    }

    function toggleVehiculo(placa) {
      setPlacasSel(function (prev) {
        var next = Object.assign({}, prev);
        next[placa] = !next[placa];
        return next;
      });
    }

    function seleccionarTodos() {
      if (!empresaActual) return;
      var next = {};
      empresaActual.vehiculos.forEach(function (v) { next[v.license_plate || v.placa] = true; });
      setPlacasSel(next);
    }

    function limpiarSeleccion() {
      setPlacasSel({});
    }

    var placasElegidas = Object.keys(placasSel).filter(function (p) { return placasSel[p]; });

    var desdeIso = combinarFechaHora(desdeFecha, desdeHora, desdeMin);
    var hastaIso = combinarFechaHora(hastaFecha, hastaHora, hastaMin);

    var rangoValido = true;
    var mensajeRango = '';
    if (desdeIso && hastaIso) {
      var dDesde = new Date(desdeIso), dHasta = new Date(hastaIso);
      if (dHasta <= dDesde) {
        rangoValido = false;
        mensajeRango = 'La fecha/hora final debe ser posterior a la inicial.';
      } else {
        var dias = (dHasta - dDesde) / (1000 * 60 * 60 * 24);
        if (dias > 5) {
          rangoValido = false;
          mensajeRango = 'El rango máximo permitido es de 5 días (elegiste ' + numero(dias, 1) + ').';
        }
      }
    }

    var puedeConsultar = empresaId && placasElegidas.length > 0 && desdeIso && hastaIso && rangoValido && !cargandoRes;

    function handleSubmit(e) {
      e.preventDefault();
      if (!puedeConsultar) return;

      var params = new URLSearchParams();
      params.set('empresa', empresaId);
      params.set('placas', placasElegidas.join(','));
      params.set('desde', desdeIso);
      params.set('hasta', hastaIso);

      setCargandoRes(true);
      setErrorRes(null);
      setResultado(null);

      fetch('/api/rendimiento?' + params.toString())
        .then(function (res) {
          return res.json().then(function (body) {
            if (!res.ok) throw new Error(body.error || ('El servidor respondió ' + res.status));
            return body;
          });
        })
        .then(function (data) {
          setResultado(data);
          setCargandoRes(false);
        })
        .catch(function (err) {
          setErrorRes(err.message);
          setCargandoRes(false);
        });
    }

    return h('div', { style: { display: 'flex', width: '100%' } },

      // --- sidebar: navegación + formulario de consulta ---
      h('aside', null,
       h('div', { className: 'sidebar-sticky' },
        h('div', { className: 'marca' },
          h('div', { className: 'marca-icono' }, h('i', { className: 'ti ti-bus', 'aria-hidden': 'true' })),
          h('div', { className: 'marca-texto' }, 'Connect', h('br'), h('span', null, 'Buses'))
        ),
        h('div', { className: 'nav-seccion' }, 'PRINCIPAL'),
        h('div', { className: 'nav-item' },
          h('i', { className: 'ti ti-gauge', 'aria-hidden': 'true' }),
          'Rendimiento'
        ),

        // --- formulario de consulta (empresa, unidades, fechas) ---
        h('div', { className: 'card card-sidebar' },
          h('h2', null, 'Consulta'),

          errorEmpresas && h('div', { className: 'error-msg' }, errorEmpresas),
          cargandoEmpresas && h('p', { className: 'cargando' }, 'Cargando empresas… (puede tardar unos segundos si el servidor estaba dormido)'),

          !cargandoEmpresas && !errorEmpresas && h('form', { onSubmit: handleSubmit },

            // 1. buscador de empresas
            h('div', { className: 'bloque' },
              h('label', null, 'Empresa'),
              h('select', { value: empresaId, onChange: handleEmpresaChange },
                h('option', { value: '' }, '— Selecciona una empresa —'),
                empresas.map(function (e) {
                  return h('option', { key: e.empresaId, value: e.empresaId }, e.nombre);
                })
              )
            ),

            empresaActual && empresaActual.error && h('div', { className: 'aviso-msg' },
              'No se pudo obtener la flota de esta empresa desde Copiloto: ' + empresaActual.error
            ),

            // 2. selección de unidad(es)
            empresaActual && !empresaActual.error && h('div', { className: 'bloque' },
              h('div', { className: 'top-vehiculos' },
                h('label', { style: { marginBottom: 0 } }, 'Unidad(es) (' + placasElegidas.length + ' seleccionadas)'),
                h('div', null,
                  h('button', { type: 'button', className: 'link-btn', onClick: seleccionarTodos }, 'Todos'),
                  h('span', null, ' · '),
                  h('button', { type: 'button', className: 'link-btn', onClick: limpiarSeleccion }, 'Limpiar')
                )
              ),
              h('div', { className: 'vehiculos-box' },
                empresaActual.vehiculos.length === 0
                  ? h('p', { className: 'cargando' }, 'Esta empresa no tiene vehículos registrados.')
                  : empresaActual.vehiculos.map(function (v) {
                      var placa = v.license_plate || v.placa;
                      return h('label', { key: placa, className: 'vehiculo-item' },
                        h('input', {
                          type: 'checkbox',
                          checked: !!placasSel[placa],
                          onChange: function () { toggleVehiculo(placa); },
                        }),
                        placa
                      );
                    })
              )
            ),

            // 3. fecha de inicio y fin, con hora en formato 24hrs
            h('div', { className: 'bloque fila-fechas' },
              h(SelectorHora, {
                etiqueta: 'Desde',
                fecha: desdeFecha, onFecha: setDesdeFecha,
                hora: desdeHora, onHora: setDesdeHora,
                minuto: desdeMin, onMinuto: setDesdeMin,
              }),
              h(SelectorHora, {
                etiqueta: 'Hasta',
                fecha: hastaFecha, onFecha: setHastaFecha,
                hora: hastaHora, onHora: setHastaHora,
                minuto: hastaMin, onMinuto: setHastaMin,
              })
            ),

            mensajeRango && h('div', { className: 'error-msg' }, mensajeRango),

            h('button', { type: 'submit', className: 'primario', disabled: !puedeConsultar },
              cargandoRes ? 'Consultando…' : 'Ver rendimiento'
            )
          )
        )
       )
      ),

      // --- contenido principal: encabezado + resultados ---
      h('main', null,

        h('div', { className: 'encabezado' },
          h('div', null,
            h('h1', null, 'Rendimiento de buses')
          ),
          h('div', { className: 'fecha-hoy' }, formatearFechaHoy())
        ),

        errorRes && h('div', { className: 'error-msg' }, errorRes),

        !resultado && !errorRes && h('div', { className: 'card estado-vacio' },
          h('i', { className: 'ti ti-chart-line', 'aria-hidden': 'true' }),
          h('p', null, 'Completa la consulta a la izquierda y presiona "Ver rendimiento" para ver los resultados aquí.')
        ),

        // --- resultados ---
        resultado && h('div', { className: 'card' },
          h('h2', null, 'Resultado: ' + (empresaActual ? empresaActual.nombre : resultado.empresa)),


          h('h3', { style: { marginTop: 0 } }, 'Comparativo de flota'),
          h('div', { className: 'comparativo' },
            resultado.comparativo && resultado.comparativo.mejorDia
              ? h(TarjetaComparativa, {
                  emoji: '🥇', fondo: '#FFF9EC',
                  etiqueta: 'Mejor día',
                  valor: formatearDiaYMD(resultado.comparativo.mejorDia.fecha) + ' · ' + numero(resultado.comparativo.mejorDia.rendimientoKmPorLitro, 2) + ' km/L',
                  detalle: numero(resultado.comparativo.mejorDia.kmRecorridos, 1) + ' km · ' + numero(resultado.comparativo.mejorDia.litrosConsumidos, 1) + ' L (toda la flota)',
                })
              : h(TarjetaComparativa, {
                  emoji: '🥇', fondo: 'var(--gris-claro)',
                  etiqueta: 'Mejor día',
                  valor: '—', detalle: 'Sin datos suficientes en el rango.',
                }),
            resultado.comparativo && resultado.comparativo.mejorVehiculo
              ? h(TarjetaComparativa, {
                  emoji: '🏆', fondo: '#EAF3DE',
                  etiqueta: 'Mejor vehículo',
                  valor: resultado.comparativo.mejorVehiculo.placa + ' · ' + numero(resultado.comparativo.mejorVehiculo.rendimientoKmPorLitro, 2) + ' km/L',
                  detalle: numero(resultado.comparativo.mejorVehiculo.kmRecorridos, 1) + ' km · ' + numero(resultado.comparativo.mejorVehiculo.litrosConsumidos, 1) + ' L',
                })
              : h(TarjetaComparativa, {
                  emoji: '🏆', fondo: 'var(--gris-claro)',
                  etiqueta: 'Mejor vehículo',
                  valor: '—', detalle: 'Sin datos suficientes en el rango.',
                }),
            resultado.comparativo && resultado.comparativo.mejorViaje
              ? h(TarjetaComparativa, {
                  emoji: '🛣️', fondo: '#E6F1FB',
                  etiqueta: 'Mejor viaje',
                  valor: numero(resultado.comparativo.mejorViaje.rendimientoKmPorLitro, 2) + ' km/L',
                  detalle: formatearSoloFecha(resultado.comparativo.mejorViaje.inicio) + ' · ' + resultado.comparativo.mejorViaje.placa + ' (≥' + resultado.comparativo.kmMinimoMejorViaje + ' km)',
                })
              : h(TarjetaComparativa, {
                  emoji: '🛣️', fondo: 'var(--gris-claro)',
                  etiqueta: 'Mejor viaje',
                  valor: '—',
                  detalle: 'Ningún viaje superó el mínimo de ' + (resultado.comparativo ? resultado.comparativo.kmMinimoMejorViaje : 50) + ' km en el rango.',
                })
          ),

          h('h3', null, 'Resumen de flota'),
          h(ResumenFlota, { flota: resultado.flota }),

          h('h3', null, 'Ranking de flota (haz clic en una placa para ver el detalle completo)'),
          h('div', { className: 'ranking-wrap' },
            resultado.vehiculos
              .slice()
              .sort(function (a, b) {
                if (a.rendimientoKmPorLitro === null && b.rendimientoKmPorLitro === null) return 0;
                if (a.rendimientoKmPorLitro === null) return 1;
                if (b.rendimientoKmPorLitro === null) return -1;
                return b.rendimientoKmPorLitro - a.rendimientoKmPorLitro;
              })
              .map(function (v, i) {
                return h(FilaRanking, {
                  key: v.placa,
                  vehiculo: v,
                  posicion: i + 1,
                  expandido: expandidoPlaca === v.placa,
                  onToggle: function () {
                    setExpandidoPlaca(expandidoPlaca === v.placa ? null : v.placa);
                  },
                });
              })
          )
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
